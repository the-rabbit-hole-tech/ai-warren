name: Hand-off web
# Checks for adapters/handoff-web only. The path filter keeps the Go jobs and this one apart: a Go
# change never starts this job, an adapter change never starts the Go ones. Drafts run nothing; the
# run happens when the PR is marked ready (see "CI and Actions minutes" in CLAUDE.md).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "adapters/handoff-web/**"
      - ".github/workflows/job-handoff-web.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  handoff_web_python:
    name: 🐍 Hand-off web (python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The oldest and newest versions the adapter supports (pyproject: >=3.9).
      matrix:
        python-version: ['3.9', '3.13']
    defaults:
      run:
        working-directory: adapters/handoff-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
  handoff_web_build:
    name: 🧱 Hand-off web (built app matches its source)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/handoff-web/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Compare
        run: git diff --exit-code -- ../template/_site/app
