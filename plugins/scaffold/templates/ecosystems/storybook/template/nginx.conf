# nginx server block for the built Storybook static site.
# Storybook emits a fully static bundle, so this just serves files and falls
# back to index.html so deep links into the catalog resolve.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache the fingerprinted assets Storybook emits; never cache the HTML
    # entry points so a redeploy is picked up immediately.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight liveness endpoint for load balancers / orchestrators.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
