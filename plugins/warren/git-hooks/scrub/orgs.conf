# Org table for the org layer of the scrub gate. Empty as shipped: put your own rows in your local
# table, ~/.config/warren/scrub-orgs.conf (SCRUB_ORGS_FILE moves it), which plugin updates never touch.
# A push whose remote URL has `<segment>/` as a path segment (any host, SSH aliases included,
# case-insensitive) runs the org scanner's identifiers scan (see guard.scrubScannerUrl) plus the
# named local term lists (<name>-terms.txt in ~/.config/warren/terms/, never in a repo).
# A repo named `plan` under that segment runs only the `forbidden` list.
#
# segment       lists
# example-org   forbidden
# other-org     forbidden extra
